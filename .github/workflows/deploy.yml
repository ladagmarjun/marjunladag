name: deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Install Node dependencies & build assets
        run: |
          npm ci
          npm run build

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # App code -> laravel_react/  (INCLUDES public/, so Laravel's Vite manifest at
      # laravel_react/public/build/manifest.json stays in sync. Keeps .env, storage and
      # the public/storage symlink untouched.)
      - name: Rsync application code
        run: |
          rsync -azr --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='storage' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      # Compiled assets -> public_html/build/  (the web root the browser downloads from)
      - name: Rsync compiled assets
        run: |
          rsync -azr --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./public/build/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.PUBLIC_PATH }}/build/

      # Cross-check: every asset listed in the manifest Laravel READS
      # (laravel_react/public/build/manifest.json) must exist in the web root
      # the browser DOWNLOADS from (public_html/build). Catches manifest/asset drift.
      - name: Verify manifest matches served assets
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            MANIFEST="${{ secrets.DEPLOY_PATH }}/public/build/manifest.json"
            SERVED="${{ secrets.PUBLIC_PATH }}/build"
            missing=0
            for f in $(grep -oE "assets/[A-Za-z0-9_-]+\.(css|js)" "$MANIFEST" | sort -u); do
              if [ ! -f "$SERVED/$f" ]; then echo "MISSING in web root: $f"; missing=1; fi
            done
            if [ "$missing" != "0" ]; then echo "Asset verification FAILED"; exit 1; fi
            echo "Manifest and served assets are in sync"
          '

      - name: Run migrations, seeders & optimize
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && \
             php artisan migrate:fresh --seed --force && \
             php artisan optimize:clear && \
             php artisan optimize && \
             php artisan queue:restart"
